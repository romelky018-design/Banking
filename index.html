<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ATS Portal | Atlantis Trucking Services</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* FULLY LOCAL — no external images, fonts, or resources */
    body {
      background: #ffffff;
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Poppins', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      cursor: pointer;
    }

    .portal-container {
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(0,0,0,0.02);
      border: 1px solid #eaeef2;
      transition: all 0.2s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .portal-container:active {
      transform: scale(0.99);
      transition: 0.05s;
    }

    .portal-content {
      padding: 3.5rem 2.5rem 3.5rem 2.5rem;
      text-align: center;
      background: white;
    }

    .company-name {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1a2c2f;
      text-transform: uppercase;
      border-bottom: 2px solid #c0a36b;
      display: inline-block;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }

    .tagline {
      font-size: 1.3rem;
      font-weight: 500;
      color: #4a5b5e;
      letter-spacing: 0.02em;
      background: #f9fafc;
      display: inline-block;
      padding: 0.4rem 2rem;
      border-radius: 50px;
      margin-bottom: 2rem;
      border-left: 3px solid #c0a36b;
      border-right: 3px solid #c0a36b;
    }

    .deco-line {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin: 1.5rem 0 0.8rem;
    }
    .deco-diamond {
      width: 7px;
      height: 7px;
      background: #c0a36b;
      transform: rotate(45deg);
      opacity: 0.65;
    }

    .portal-title {
      font-size: 2rem;
      font-weight: 600;
      margin: 1.4rem 0 0.4rem;
      color: #1f3e42;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    @media (max-width: 680px) {
      .portal-content {
        padding: 2rem 1.5rem;
      }
      .company-name {
        font-size: 1.6rem;
      }
      .tagline {
        font-size: 1rem;
        padding: 0.25rem 1rem;
      }
      .portal-title {
        font-size: 1.5rem;
      }
    }

    .portal-container:focus-visible {
      outline: 3px solid #c0a36b;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <div class="portal-container" id="atsPortal" tabindex="0" role="button" aria-label="Atlantis Trucking Portal - click or press space to access login">
    <div class="portal-content">
      <div class="company-name">ATLANTIS TRUCKING SERVICES, INC</div>
      <div class="tagline">La logistique de l’argent et des biens</div>
      <div class="deco-line">
        <div class="deco-diamond"></div>
        <div class="deco-diamond"></div>
        <div class="deco-diamond"></div>
      </div>
      <div class="portal-title">Bienvenue sur le Portail de Gestion de L’ATS</div>
    </div>
  </div>

  <script>
    (function() {
      // 100% local — no external requests
      const portal = document.getElementById('atsPortal');
      let isRedirecting = false;

      function redirectToLogin(event) {
        if (isRedirecting) return;
        isRedirecting = true;
        if (event && event.stopPropagation) event.stopPropagation();
        window.location.href = 'login.html';
      }

      // Click on the card
      if (portal) {
        portal.addEventListener('click', function(e) {
          e.stopPropagation();
          redirectToLogin(e);
        });
      }

      // Click anywhere on the page (white background)
      document.body.addEventListener('click', function(event) {
        redirectToLogin(event);
      });

      // Spacebar press
      window.addEventListener('keydown', function(event) {
        if (event.code === 'Space' || event.key === ' ' || event.keyCode === 32) {
          event.preventDefault();
          redirectToLogin(event);
        }
      });
    })();
  </script>
</body>
</html>
