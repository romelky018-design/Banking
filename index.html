<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Atlantis Trucking Services | Portail professionnel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', 'Roboto', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0a1a2f, #05101f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      cursor: pointer;
    }

    /* grain subtil */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* carte principale interactive */
    .hero-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(6, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 56px;
      border: 1px solid rgba(30, 100, 160, 0.5);
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(52, 152, 219, 0.2);
      padding: 2.5rem 2rem 3rem;
      transition: all 0.3s ease;
      text-align: center;
      position: relative;
      z-index: 2;
      cursor: pointer;
    }

    /* effet hover interactif */
    .hero-card:hover {
      border-color: rgba(0, 160, 255, 0.8);
      box-shadow: 0 30px 50px -15px rgba(0, 160, 255, 0.25), 0 0 0 1px rgba(0, 180, 255, 0.3);
      background: rgba(5, 18, 32, 0.82);
      transform: scale(1.01);
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    /* Logo container — texte "aTs" et nom complet (conservés en anglais comme demandé) */
    .logo-master {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* symbole principal aTs */
    .ats-symbol {
      font-family: 'Segoe UI', 'Inter', 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 6rem;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #EFF6FF 0%, #A0D2FF 40%, #2C7DA0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      margin-bottom: 0.75rem;
      display: inline-block;
      position: relative;
    }

    .ats-symbol::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 15%;
      width: 70%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
      border-radius: 4px;
    }

    /* nom complet de l'entreprise (en anglais comme demandé) */
    .company-name-full {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      background: linear-gradient(120deg, #F0F9FF, #BAE6FD);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
      margin-top: 0.5rem;
      word-break: keep-all;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.2rem;
    }

    .inc-tag {
      font-size: 1.3rem;
      font-weight: 500;
      color: #7aa9c4;
      margin-left: 0.2rem;
    }

    /* séparateur élégant */
    .divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, #1e4b6e, #3b82f6, #1e4b6e);
      margin: 1.8rem auto 1.5rem;
      border-radius: 3px;
    }

    /* titre & description en français */
    .hero-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #eef4ff;
      margin-bottom: 1rem;
      letter-spacing: -0.01em;
    }

    .hero-description {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #b9d0f0;
      max-width: 600px;
      margin: 0 auto 2rem;
      font-weight: 400;
    }

    /* indice interactif bilingue mais en français */
    .interactive-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(16, 54, 84, 0.6);
      backdrop-filter: blur(4px);
      padding: 0.7rem 1.6rem;
      border-radius: 60px;
      border: 1px solid rgba(59, 130, 246, 0.5);
      font-size: 0.9rem;
      font-weight: 500;
      color: #bbd7fb;
      margin-top: 1.2rem;
      transition: all 0.2s;
    }

    .interactive-hint svg {
      width: 20px;
      height: 20px;
      stroke: #60a5fa;
      stroke-width: 1.7;
      fill: none;
    }

    .keycap {
      background: #0f212f;
      border-radius: 8px;
      padding: 0.2rem 0.7rem;
      font-family: monospace;
      font-weight: bold;
      color: #c5e2ff;
      border: 1px solid #2c6e9e;
      box-shadow: inset 0 1px 0 #2c6e9e40, 0 1px 2px rgba(0,0,0,0.2);
    }

    /* responsive */
    @media (max-width: 650px) {
      .hero-card {
        padding: 1.8rem 1.2rem 2.2rem;
      }
      .ats-symbol {
        font-size: 4rem;
      }
      .company-name-full {
        font-size: 1.2rem;
        flex-wrap: wrap;
      }
      .hero-title {
        font-size: 1.6rem;
      }
      .hero-description {
        font-size: 0.95rem;
      }
      .interactive-hint {
        font-size: 0.8rem;
        padding: 0.5rem 1.2rem;
      }
    }

    /* animations d'apparition */
    @keyframes gentleRise {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-master, .hero-title, .hero-description, .interactive-hint {
      animation: gentleRise 0.6s ease-out forwards;
    }

    .hero-description {
      animation-delay: 0.1s;
      opacity: 0;
    }
    .interactive-hint {
      animation-delay: 0.2s;
      opacity: 0;
    }

    /* focus outline pour accessibilité */
    .hero-card:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.6), 0 25px 40px -10px black;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <!-- Carte interactive : clic souris ou touche espace déclenchent la redirection vers login.html -->
  <div class="hero-card" id="mainInteractiveCard" tabindex="0" role="button" aria-label="Cliquez ou appuyez sur Espace pour accéder au portail de connexion">
    <!-- Logo : texte "aTs" et nom complet en anglais (conforme à la demande) -->
    <div class="logo-master">
      <div class="ats-symbol">aTs</div>
      <div class="company-name-full">
        ATLANTIS TRUCKING SERVICES,&nbsp;<span class="inc-tag">INC</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Tout le contenu textuel informatif est en français, sauf le logo -->
    <h1 class="hero-title">Logistique fiable, portée océanique</h1>
    <p class="hero-description">
      Solutions de transport précises, flotte moderne et accompagnement dédié.<br>
      Votre partenaire de confiance pour le transport terrestre et intermodal.
    </p>

    <!-- Indice interactif en français -->
    <div class="interactive-hint">
      <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 10L12 4L6 10" />
        <path d="M12 4L12 20" />
        <rect x="2" y="14" width="20" height="6" rx="2" />
        <line x1="9" y1="17" x2="15" y2="17" />
      </svg>
      <span>Cliquez n'importe où ou appuyez sur <span class="keycap">␣ Espace</span> → Accéder au portail sécurisé</span>
    </div>
  </div>

  <script>
    (function() {
      // Élément principal interactif
      const interactiveZone = document.getElementById('mainInteractiveCard');
      if (!interactiveZone) return;

      // Éviter les redirections multiples
      let isRedirecting = false;
      
      // Fonction de redirection sécurisée vers login.html
      function safeRedirect() {
        if (isRedirecting) return;
        isRedirecting = true;
        window.location.href = 'login.html';
      }
      
      // Petit retour visuel avant redirection
      function addActiveMoment() {
        if (!interactiveZone) return;
        interactiveZone.style.transform = 'scale(0.99)';
        setTimeout(() => {
          if (interactiveZone) interactiveZone.style.transform = '';
        }, 100);
      }
      
      // Gestion du clic souris sur toute la carte
      interactiveZone.addEventListener('click', (e) => {
        e.stopPropagation();
        addActiveMoment();
        setTimeout(() => safeRedirect(), 25);
      });
      
      // Gestion du clavier : Espace et Entrée (pour accessibilité)
      interactiveZone.addEventListener('keydown', (e) => {
        const isSpace = (e.code === 'Space' || e.key === ' ' || e.keyCode === 32);
        const isEnter = (e.code === 'Enter' || e.key === 'Enter');
        
        if (isSpace || isEnter) {
          e.preventDefault();  // Empêche le scroll ou tout comportement par défaut
          e.stopPropagation();
          addActiveMoment();
          setTimeout(() => safeRedirect(), 25);
        }
      });
      
      // Écouteur global pour la touche ESPACE, où que l'utilisateur se trouve sur la page
      // Cela respecte la demande : "si j'utilise la souris ou la touche espace, cela m'envoie vers login.html"
      function globalSpaceHandler(event) {
        const isSpace = (event.code === 'Space' || event.key === ' ' || event.keyCode === 32);
        if (!isSpace) return;
        
        // Vérifier que l'utilisateur n'est pas en train de taper dans un champ de saisie (bien qu'il n'y en ait pas, sécurité)
        const activeEl = document.activeElement;
        if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
          return; // Ne pas interférer avec une éventuelle zone de texte (non présente ici)
        }
        
        event.preventDefault();
        addActiveMoment();
        setTimeout(() => safeRedirect(), 25);
      }
      
      // Ajout de l'écouteur global pour la touche Espace
      window.addEventListener('keydown', globalSpaceHandler);
      
      // Petite amélioration : permettre également le clic sur le document ? Non, seul la carte est clickable intentionnellement,
      // mais pour l'expérience, l'utilisateur peut aussi cliquer sur la carte. La touche espace fonctionne globalement.
      // Ajout d'attributs ARIA pour l'accessibilité
      interactiveZone.setAttribute('aria-label', 'Cliquez ou appuyez sur la touche Espace pour accéder à la page de connexion login.html');
      
      // Message console (discret)
      console.log("Atlantis Trucking Services - Page d'accueil professionnelle. Cliquez ou pressez ESPACE → redirection vers login.html");
      
      // Option : indice visuel supplémentaire pour montrer que la carte est interactive
      interactiveZone.style.cursor = 'pointer';
      
      // Animation subtile au chargement pour attirer l'attention (optionnelle)
      setTimeout(() => {
        if (interactiveZone && !isRedirecting) {
          interactiveZone.style.transition = 'box-shadow 0.2s';
          interactiveZone.style.boxShadow = '0 0 0 2px rgba(59,130,246,0.3), 0 25px 45px -12px rgba(0,0,0,0.6)';
          setTimeout(() => {
            if (interactiveZone) interactiveZone.style.boxShadow = '';
          }, 600);
        }
      }, 300);
    })();
  </script>
</body>
</html>
